<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Force Showcase: The Evolution of Call of Duty (2003 - 2024)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter, Orbitron & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tactical: {
              bg: '#050810',
              surface: '#0b1120',
              panel: '#111b33',
              border: '#1b2a4a',
              cyan: '#00f0ff',
              amber: '#ff7700',
              emerald: '#10b981',
              purple: '#8b5cf6',
              muted: '#7a8ba9',
              platinum: '#e2e8f0'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
            mono: ['"Share Tech Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none;
      direction: ltr !important;
      unicode-bidi: isolate;
    }

    body {
      direction: ltr !important;
      text-align: left;
    }
    
    @keyframes gridShift {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }
    .tactical-grid {
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
      animation: gridShift 10s linear infinite;
    }
    
    @keyframes scanBeam {
      0% { top: -10%; opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { top: 110%; opacity: 0; }
    }
    .laser-scanbeam {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 5%, rgba(0, 240, 255, 0.9) 50%, transparent 95%);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.9), 0 0 30px rgba(0, 240, 255, 0.5);
      pointer-events: none;
      z-index: 1;
      animation: scanBeam 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .glow-orb-cyan {
      position: fixed;
      width: 500px;
      height: 500px;
      top: -120px;
      left: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .glow-orb-amber {
      position: fixed;
      width: 450px;
      height: 450px;
      bottom: -120px;
      right: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 119, 0, 0.16) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Tactical HUD Corner Brackets */
    .tactical-border { position: relative; }
    .tactical-border::before, .tactical-border::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: #00f0ff;
      pointer-events: none;
      z-index: 10;
    }
    .tactical-border::before {
      top: -2px;
      left: -2px;
      border-top: 2px solid #00f0ff;
      border-left: 2px solid #00f0ff;
    }
    .tactical-border::after {
      bottom: -2px;
      right: -2px;
      border-bottom: 2px solid #00f0ff;
      border-right: 2px solid #00f0ff;
    }

    .amber-bracket::before, .amber-bracket::after { border-color: #ff7700 !important; }
    .nvg-bracket::before, .nvg-bracket::after { border-color: #10b981 !important; }
    .biohazard-bracket::before, .biohazard-bracket::after { border-color: #ef4444 !important; }
    .violet-bracket::before, .violet-bracket::after { border-color: #8b5cf6 !important; }

    .glass-card {
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.22);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .static-img {
      transform: none !important;
      animation: none !important;
      transition: none !important;
      filter: contrast(1.05) brightness(0.95);
    }

    @keyframes cyberStripes {
      0% { background-position: 0 0; }
      100% { background-position: 30px 0; }
    }
    .cyber-bar {
      background-image: linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.22) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, 0.22) 50%,
        rgba(255, 255, 255, 0.22) 75%,
        transparent 75%,
        transparent
      );
      background-size: 20px 20px;
      animation: cyberStripes 1.2s linear infinite;
    }

    @keyframes statGlow {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(255, 119, 0, 0.45)); }
      50% { filter: drop-shadow(0 0 24px rgba(255, 119, 0, 0.85)); }
    }
    .glow-stat { animation: statGlow 2.5s ease-in-out infinite; }

    .scanlines-overlay {
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 240, 255, 0.02) 3px,
        rgba(0, 240, 255, 0.02) 4px
      );
    }

    .slide-enter {
      opacity: 0;
      transform: scale(0.985) translateY(6px);
      filter: blur(3px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slide-active {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    @keyframes shakeBtn {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake-error { animation: shakeBtn 0.3s ease-in-out; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050810; }
    ::-webkit-scrollbar-thumb { background: #1b2a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
  </style>
</head>

<body class="bg-tactical-bg text-tactical-platinum font-sans selection:bg-tactical-cyan selection:text-black overflow-hidden h-screen w-screen flex flex-col justify-between tactical-grid relative select-none">

    <!-- Right Controls -->

  </header>

  <!-- ================= MAIN SLIDE VIEWPORT ================= -->
  <main class="relative z-10 flex-1 flex items-center justify-center p-3 sm:p-5 lg:p-6 max-w-7xl mx-auto w-full overflow-hidden">
    <div id="slideContainer" class="w-full flex items-center justify-center h-full max-h-[640px]">
      <!-- Slides dynamically rendered here via renderSlide(index) -->
    </div>
  </main>

  <!-- ================= BOTTOM NAVIGATION & KILLSTREAK BAR ================= -->
  <footer class="relative z-20 border-t border-tactical-border/90 bg-tactical-surface/95 backdrop-blur px-4 py-2.5 flex items-center justify-between">
    <!-- Prev Slide Button -->
    <button id="prevBtn" class="px-4 py-1.5 rounded bg-tactical-panel border border-tactical-border hover:border-tactical-cyan text-tactical-platinum hover:text-tactical-cyan transition font-mono text-xs flex items-center gap-1.5 disabled:opacity-30">

    <!-- Persistent 4-Killstreak Indicator -->

      <div id="streakBadge3" class="px-2.5 py-1 rounded bg-tactical-bg border border-tactical-border text-tactical-muted/60 transition flex items-center gap-1">

      <div id="streakBadge4" class="px-2.5 py-1 rounded bg-tactical-bg border border-tactical-border text-tactical-muted/60 transition flex items-center gap-1">

    <!-- Next Slide Button -->
    <button id="nextBtn" class="px-5 py-1.5 rounded bg-cyan-950 border border-tactical-cyan hover:bg-tactical-cyan hover:text-black text-white font-mono text-xs font-bold transition flex items-center gap-1.5 shadow-[0_0_15px_rgba(0,240,255,0.25)]">
      <span>NEXT [→]</span>
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </footer>

  <!-- ================= SLIDE ROSTER MODAL (25 SLIDES) ================= -->
  <div id="slideIndexModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="w-full max-w-4xl max-h-[85vh] bg-tactical-surface border-2 border-tactical-cyan rounded-lg tactical-border shadow-[0_0_35px_rgba(0,240,255,0.25)] flex flex-col overflow-hidden">
      <div class="px-6 py-3.5 border-b border-tactical-border flex items-center justify-between bg-tactical-panel">

  <!-- ================= CORE APPLICATION LOGIC ================= -->
  <script>
    /* 1. AUTHENTIC HIGH-RESOLUTION COD MEDIA ASSETS */
    const ASSETS = {
      blackops: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/blackops.jpg",
      cdl: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/cdl.jpg",
      ghost: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/ghost.png",
      price: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/price.png",
      warzone: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/warzone.jpg",
      wwii: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/wwii.jpg",
      zombies: "https://raw.githubusercontent.com/SOBO-S/index-3-/refs/heads/main/zombies.jpg"
    };

    /* 2. WEB AUDIO API SYNTHESIZER */
    class TacticalAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.09, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playSlideChange() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
      }
      playHitmarker() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        [0, 0.035].forEach(delay => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1400, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + 0.03);
        });
      }
      playReveal() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        [320, 480, 640, 960].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.04);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.04 + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.04);
          osc.stop(this.ctx.currentTime + idx * 0.04 + 0.16);
        });
      }
      playError() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.setValueAtTime(110, this.ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.14);
      }
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }
    }
    const audio = new TacticalAudioEngine();

    /* 3. 4-ERA DOSSIER DATA (FOR SLIDE 05) */
    const DOSSIER_DATA = [
      {
        y: "2003",
        code: "INTEL FILE #01 // YEAR 2003",
        status: "DECLASSIFIED",
        heading: "The Initial World War II Deployment",
        body: "Infinity Ward launched the first Call of Duty on PC, pioneering authentic squad AI combat and ADS iron sights aiming across American, British, and Soviet European frontlines.",
        source: "Source: Activision Official Archives (2003)",
        thumb: ASSETS.wwii
      },
      {
        y: "2007",
        code: "INTEL FILE #02 // YEAR 2007",
        status: "TOP PRIORITY",
        heading: "Modern Warfare Shifts the Genre",
        body: "Infinity Ward leaped from WWII into present-day combat with Call of Duty 4, establishing Create-a-Class custom loadouts, soldier perks, radar UAVs, and attack helicopter killstreaks.",
        source: "Source: CallofDuty.com 20th Anniversary Retrospective",
        thumb: ASSETS.price
      },
      {
        y: "2010",
        code: "INTEL FILE #03 // YEAR 2010",
        status: "CONFIDENTIAL",
        heading: "Black Ops & Cold War Covert Operations",
        body: "Treyarch launched Call of Duty: Black Ops, breaking global entertainment records with Cold War intrigue and cementing cooperative Nazi Zombies into a massive permanent sub-franchise.",
        source: "Source: Activision Financial Disclosures (2010)",
        thumb: ASSETS.blackops
      },
      {
        y: "2021",
        code: "INTEL FILE #04 // YEAR 2021",
        status: "HISTORIC MILESTONE",
        heading: "The 400 Million Sales Frontier & Warzone",
        body: "Activision officially confirmed the franchise surpassed 400 million premium game copies sold worldwide, while free-to-play Warzone crossed 100 million active battle royale operators.",
        source: "Source: CallofDuty.com (Official Milestone Release, April 2021)",
        thumb: ASSETS.warzone
      }
    ];

    /* 4. CHECKPOINT & KILLSTREAK UNLOCK TRACKER */
    const STREAKS_UNLOCKED = {
      1: false, // UAV (Slide 7)
      2: false, // Care Package (Slide 12)
      3: false, // Chopper Gunner (Slide 17)
      4: false  // Tactical Nuke (Slide 21)
    };

    function updateKillstreakBadges() {
      const b1 = document.getElementById('streakBadge1');
      const b2 = document.getElementById('streakBadge2');
      const b3 = document.getElementById('streakBadge3');
      const b4 = document.getElementById('streakBadge4');

      if (b1) {
        b1.className = STREAKS_UNLOCKED[1] 
          ? 'px-2.5 py-1 rounded bg-amber-950/80 border border-tactical-amber text-tactical-amber font-bold shadow-[0_0_10px_rgba(255,119,0,0.4)] flex items-center gap-1'
          : 'px-2.5 py-1 rounded bg-tactical-bg border border-tactical-border text-tactical-muted/60 flex items-center gap-1';
      }
      if (b2) {
        b2.className = STREAKS_UNLOCKED[2] 
          ? 'px-2.5 py-1 rounded bg-cyan-950/80 border border-tactical-cyan text-tactical-cyan font-bold shadow-[0_0_10px_rgba(0,240,255,0.4)] flex items-center gap-1'
          : 'px-2.5 py-1 rounded bg-tactical-bg border border-tactical-border text-tactical-muted/60 flex items-center gap-1';
      }
      if (b3) {
        b3.className = STREAKS_UNLOCKED[3] 
          ? 'px-2.5 py-1 rounded bg-emerald-950/80 border border-tactical-emerald text-emerald-400 font-bold shadow-[0_0_10px_rgba(16,185,129,0.4)] flex items-center gap-1'
          : 'px-2.5 py-1 rounded bg-tactical-bg border border-tactical-border text-tactical-muted/60 flex items-center gap-1';
      }

    function animateCounters() {
      const counters = document.querySelectorAll('[data-counter]');
      counters.forEach(counter => {
        const target = parseFloat(counter.getAttribute('data-counter'));
        if (isNaN(target)) return;
        const suffix = counter.getAttribute('data-suffix') || '';
        const prefix = counter.getAttribute('data-prefix') || '';
        const duration = 900;
        const startTime = performance.now();

        function update(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const currentVal = Math.round(target * easeOut);
          counter.textContent = `${prefix}${currentVal}${suffix}`;
          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            counter.textContent = `${prefix}${target}${suffix}`;
          }
        }
        requestAnimationFrame(update);
      });
    }

    let canvas, ctx, width, height;
    const particles = [];
    const PARTICLE_COUNT = 45;
    let radarAngle = 0;
    let sonarRadius1 = 0;
    let sonarRadius2 = 50;

    const radarBlips = [
      { dist: 40, angle: 0.8, alpha: 0 },
      { dist: 65, angle: 2.3, alpha: 0 },
      { dist: 85, angle: 4.1, alpha: 0 },
      { dist: 55, angle: 5.4, alpha: 0 }
    ];

    function initRadar() {
      canvas = document.getElementById('radarCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      function resizeCanvas() {
        if (!canvas) return;
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 1.0,
          vy: (Math.random() - 0.5) * 1.0,
          radius: Math.random() * 1.6 + 0.6,
          alpha: Math.random() * 0.4 + 0.2
        });
      }
    }

    function animateRadar() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, width, height);

      const rx = width - 140;
      const ry = 140;
      const rRadius = 95;

      sonarRadius1 += 1.1;
      if (sonarRadius1 > rRadius) sonarRadius1 = 0;
      const sonarAlpha1 = Math.max(0, 0.35 * (1 - sonarRadius1 / rRadius));

      sonarRadius2 += 1.1;
      if (sonarRadius2 > rRadius) sonarRadius2 = 0;
      const sonarAlpha2 = Math.max(0, 0.35 * (1 - sonarRadius2 / rRadius));

      ctx.save();
      // Sonar rings
      ctx.strokeStyle = `rgba(0, 240, 255, ${sonarAlpha1})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(rx, ry, sonarRadius1, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = `rgba(0, 240, 255, ${sonarAlpha2})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(rx, ry, sonarRadius2, 0, Math.PI * 2);
      ctx.stroke();

      // Range rings & crosshairs
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(rx, ry, rRadius, 0, Math.PI * 2);
      ctx.arc(rx, ry, rRadius * 0.66, 0, Math.PI * 2);
      ctx.arc(rx, ry, rRadius * 0.33, 0, Math.PI * 2);
      ctx.moveTo(rx - rRadius, ry);
      ctx.lineTo(rx + rRadius, ry);
      ctx.moveTo(rx, ry - rRadius);
      ctx.lineTo(rx, ry + rRadius);
      ctx.stroke();

      // Sweep Beam
      radarAngle += 0.035;
      if (radarAngle > Math.PI * 2) radarAngle -= Math.PI * 2;

      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.arc(rx, ry, rRadius, radarAngle - 0.28, radarAngle);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx + Math.cos(radarAngle) * rRadius, ry + Math.sin(radarAngle) * rRadius);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Blips
      radarBlips.forEach(blip => {
        const diff = Math.abs(radarAngle - blip.angle);
        if (diff < 0.08 || Math.abs(diff - Math.PI * 2) < 0.08) {
          blip.alpha = 1.0;
        } else {
          blip.alpha = Math.max(0, blip.alpha - 0.015);
        }
        if (blip.alpha > 0) {
          const bx = rx + Math.cos(blip.angle) * blip.dist;
          const by = ry + Math.sin(blip.angle) * blip.dist;
          ctx.fillStyle = `rgba(255, 119, 0, ${blip.alpha})`;
          ctx.beginPath();
          ctx.arc(bx, by, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // Floating particles mesh
      ctx.fillStyle = '#00f0ff';
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = p.x - particles[j].x;
          const dy = p.y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 90) {
            ctx.strokeStyle = `rgba(0, 240, 255, ${0.1 * (1 - dist / 90)})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      });
      ctx.globalAlpha = 1.0;

      requestAnimationFrame(animateRadar);
    }

    function startTelemetry() {
      let lat = 34.0522;
      let lon = 118.2437;
      setInterval(() => {
        if (!telemetryData) return;
        lat += (Math.random() - 0.5) * 0.001;
        lon += (Math.random() - 0.5) * 0.001;
        telemetryData.innerText = `GRID: ${lat.toFixed(4)}°N | ${lon.toFixed(4)}°W`;
      }, 2500);
    }

    /* 12. INITIALIZATION */
    window.addEventListener('DOMContentLoaded', () => {
      initDomElements();
      setupEventListeners();
      renderSlide(0);
      initRadar();
      animateRadar();
      startTelemetry();
    });
  </script>
</body>
</html>
